<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#4a6fa5"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b5b95"/>
      <stop offset="100%" style="stop-color:#8b7bb5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <path d="M200 50 C280 50 350 120 350 200 C350 280 280 350 200 350 C120 350 50 280 50 200 C50 120 120 50 200 50" 
        stroke="url(#blueGrad)" stroke-width="25" fill="none" stroke-linecap="round"/>
  
  <!-- Middle ring -->
  <path d="M200 100 C250 100 300 150 300 200 C300 250 250 300 200 300 C150 300 100 250 100 200 C100 150 150 100 200 100" 
        stroke="url(#purpleGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
  
  <!-- Inner circle -->
  <circle cx="200" cy="200" r="45" fill="url(#goldGrad)"/>
  
  <!-- Arrow -->
  <path d="M160 240 L280 120" stroke="url(#blueGrad)" stroke-width="15" stroke-linecap="round"/>
  <path d="M280 120 L250 130 L275 105 Z" fill="url(#blueGrad)"/>
</svg>
